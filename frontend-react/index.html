<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    // ПЕРВЫМ в <head>: <base> = корень mount (<prefix>/app/), вычисленный из URL.
    // Vite base:"./" делает ассеты относительными (один билд под /app/ и /desk/app/),
    // но на вложенных SPA-роутах (/app/curves/kspath, /app/funds/X5) относительный
    // "./assets" резолвился бы от текущего пути → 404. <base> фиксит корень до того,
    // как парсер дойдёт до module-script. Root-relative fetch api.js ("/api…") не задет.
    (function () {
      var mount = location.pathname.replace(/\/app(\/.*)?$/, "") + "/app/";
      var b = document.createElement("base");
      b.href = mount;
      document.head.appendChild(b);
    })();
  </script>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <title>DESK</title>
  <script>
    // pre-paint: применяем тему до React, чтобы не мигало белым
    try {
      var t = localStorage.getItem("theme");
      if (t === "dark") {
        document.documentElement.style.background = "#000";
        document.documentElement.style.colorScheme = "dark";
      } else if (t === "win" || t === "grey") {
        // grey заменена на win (old internet) — старое значение мигрируется в App
        document.documentElement.style.background = "#c0c0c0";
      }
    } catch (e) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
