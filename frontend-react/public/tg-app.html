<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>DESK · Алерты</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Палитра тянется из темы Telegram; фолбэки — тёмная схема деска.
     Светлую тему клиент отдаёт теми же переменными, поэтому отдельной ветки нет,
     а собственные акценты заданы так, чтобы контраст держался в обеих. */
  :root {
    --bg: var(--tg-theme-bg-color, #0d1117);
    --surface: var(--tg-theme-secondary-bg-color, #161b26);
    --surface-2: color-mix(in srgb, var(--surface) 92%, var(--text) 8%);
    --text: var(--tg-theme-text-color, #e6edf3);
    --hint: var(--tg-theme-hint-color, #8b96a5);
    --link: var(--tg-theme-link-color, #58a6ff);
    --accent: var(--tg-theme-button-color, #2ea6ff);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --border: color-mix(in srgb, var(--hint) 32%, transparent);
    --border-strong: color-mix(in srgb, var(--hint) 55%, transparent);
    --green: #3fb950;
    --red: #f85149;
    --amber: #d29922;
    --radius: 12px;
    --radius-sm: 9px;
    --tap: 44px;
    --gap: 10px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, "Segoe UI", sans-serif;
    padding: 0 14px calc(32px + env(safe-area-inset-bottom));
    overscroll-behavior-y: contain;
    -webkit-tap-highlight-color: transparent;
  }
  .num { font-variant-numeric: tabular-nums; }
  svg { display: block; flex: none; }

  /* --- шапка: табы + звонок --- */
  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--bg);
    padding: 10px 0 8px;
    display: flex; align-items: center; gap: var(--gap);
  }
  .tabs {
    flex: 1; display: flex; gap: 4px; padding: 3px;
    background: var(--surface); border-radius: var(--radius);
  }
  .tabs button {
    flex: 1; min-height: 38px; border: 0; border-radius: var(--radius-sm);
    background: transparent; color: var(--hint);
    font-size: 15px; font-weight: 600; font-family: inherit;
    cursor: pointer; transition: background .18s, color .18s;
  }
  .tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-text); }
  .icon-btn {
    width: var(--tap); height: var(--tap); flex: none;
    display: grid; place-items: center;
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); color: var(--hint);
    cursor: pointer; transition: color .18s, border-color .18s;
  }
  .icon-btn[aria-pressed="true"] { color: var(--amber); border-color: var(--amber); }

  /* --- карточки --- */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px 14px; margin-bottom: var(--gap);
  }
  .card-top { display: flex; align-items: flex-start; gap: 10px; }
  .card-title { font-size: 15px; font-weight: 650; line-height: 1.3; flex: 1; min-width: 0; }
  .card-sub { color: var(--hint); font-size: 12.5px; margin-top: 1px; }
  .cond { margin-top: 8px; font-size: 14.5px; display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
  .cond .side { font-weight: 600; }
  .cond .side.buy, .cond .side.ask { color: var(--green); }
  .cond .side.sell, .cond .side.bid { color: var(--red); }
  .meta { color: var(--hint); font-size: 13px; margin-top: 6px; }
  .card-actions {
    display: flex; gap: 6px; margin: 10px -6px -6px;
  }
  .card-actions button {
    min-height: 36px; padding: 0 10px; border: 0; border-radius: var(--radius-sm);
    background: transparent; color: var(--link);
    font: 600 13.5px/1 inherit; font-family: inherit;
    display: inline-flex; align-items: center; gap: 5px;
    cursor: pointer; transition: background .18s;
  }
  .card-actions button:hover { background: color-mix(in srgb, var(--link) 12%, transparent); }
  .card-actions button.danger { color: var(--red); }
  .card-actions button.danger:hover { background: color-mix(in srgb, var(--red) 12%, transparent); }

  .badge {
    flex: none; font-size: 11.5px; font-weight: 600; letter-spacing: .01em;
    padding: 3px 8px; border-radius: 20px;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .badge.on { background: color-mix(in srgb, var(--green) 18%, transparent); color: var(--green); }
  .badge.fired { background: color-mix(in srgb, var(--amber) 20%, transparent); color: var(--amber); }
  .badge.off { background: color-mix(in srgb, var(--hint) 18%, transparent); color: var(--hint); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* --- формы --- */
  form { background: var(--surface); border: 1px solid var(--border);
         border-radius: var(--radius); padding: 14px; margin-top: 16px; }
  fieldset { border: 0; padding: 0; margin: 0 0 16px; }
  fieldset:last-of-type { margin-bottom: 10px; }
  legend, .form-title {
    padding: 0; font-size: 12px; font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase; color: var(--hint); margin-bottom: 10px;
  }
  .form-title { font-size: 15px; text-transform: none; letter-spacing: 0; color: var(--text); }
  label.f { display: block; margin-bottom: 12px; }
  label.f > span { display: block; font-size: 13px; color: var(--hint); margin-bottom: 5px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; min-width: 0; }
  input[type="text"], input[type="number"], input[type="search"] {
    width: 100%; min-height: var(--tap);
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 10px 12px; font: 16px/1.2 inherit; font-family: inherit;
    transition: border-color .18s;
  }
  input::placeholder { color: color-mix(in srgb, var(--hint) 75%, transparent); }
  input:focus-visible, button:focus-visible, .chip:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  input:focus { outline: none; border-color: var(--accent); }

  /* сегментированный контрол вместо <select> — на iOS нативный select
     выглядит инородно и даёт мелкую цель нажатия */
  .seg { display: flex; gap: 4px; padding: 3px; background: var(--bg);
         border: 1px solid var(--border); border-radius: var(--radius-sm); }
  .seg button {
    flex: 1; min-height: 38px; border: 0; border-radius: 7px;
    background: transparent; color: var(--hint);
    font: 600 14px/1 inherit; font-family: inherit; cursor: pointer;
    transition: background .18s, color .18s;
  }
  .seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--text); }
  .seg.side button[aria-pressed="true"][data-v="ask"], .seg.side button[aria-pressed="true"][data-v="buy"] {
    background: color-mix(in srgb, var(--green) 22%, transparent); color: var(--green); }
  .seg.side button[aria-pressed="true"][data-v="bid"], .seg.side button[aria-pressed="true"][data-v="sell"] {
    background: color-mix(in srgb, var(--red) 20%, transparent); color: var(--red); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    min-height: 36px; padding: 0 12px; border-radius: 20px;
    border: 1px solid var(--border); background: var(--bg); color: var(--hint);
    font: 600 13.5px/1 inherit; font-family: inherit;
    display: inline-flex; align-items: center; gap: 6px;
    cursor: pointer; transition: background .18s, color .18s, border-color .18s;
  }
  .chip[aria-pressed="true"] {
    background: color-mix(in srgb, var(--accent) 18%, transparent);
    border-color: var(--accent); color: var(--text);
  }
  .chip.removable { background: color-mix(in srgb, var(--accent) 15%, transparent);
                    border-color: var(--accent); color: var(--text); }
  .chip.removable svg { opacity: .65; }

  .picker { position: relative; }
  .suggest {
    position: absolute; inset-inline: 0; top: calc(100% + 4px); z-index: 30;
    background: var(--surface-2); border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm); max-height: 232px; overflow-y: auto;
    box-shadow: 0 10px 28px rgba(0,0,0,.35);
  }
  .suggest button {
    display: block; width: 100%; min-height: var(--tap); padding: 9px 12px;
    border: 0; border-bottom: 1px solid var(--border); background: transparent;
    color: var(--text); text-align: left; font: 14px/1.35 inherit; font-family: inherit;
    cursor: pointer;
  }
  .suggest button:last-child { border-bottom: 0; }
  .suggest button:hover { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .suggest .s-sub { display: block; color: var(--hint); font-size: 12px; margin-top: 2px; }

  .submit {
    width: 100%; min-height: 48px; border: 0; border-radius: var(--radius);
    background: var(--accent); color: var(--accent-text);
    font: 650 16px/1 inherit; font-family: inherit; cursor: pointer;
    transition: opacity .18s;
  }
  .submit[disabled] { opacity: .55; cursor: default; }
  .hint { color: var(--hint); font-size: 12.5px; margin-top: 8px; line-height: 1.45; }
  .err { color: var(--red); font-size: 13.5px; margin-top: 8px; display: flex; gap: 6px; }
  .err:empty { display: none; }

  .empty { text-align: center; color: var(--hint); font-size: 14px;
           padding: 28px 12px; border: 1px dashed var(--border); border-radius: var(--radius); }
  .screen { text-align: center; color: var(--hint); padding: 56px 16px; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="app"><div class="screen">Загрузка…</div></div>
<script>
(function () {
  "use strict";
  const tg = window.Telegram && window.Telegram.WebApp;
  const initData = tg && tg.initData;
  const API = location.pathname.replace(/\/(app\/)?[^/]*$/, "") + "/api/tg";
  const app = document.getElementById("app");
  const $ = (id) => document.getElementById(id);
  if (tg) { tg.ready(); tg.expand(); }

  if (!initData) {
    app.innerHTML = '<div class="screen">Открой страницу из бота @deskdeskdesk_bot — кнопкой «Алерты».</div>';
    return;
  }

  // Иконки — inline SVG (Lucide), а не эмодзи: эмодзи рендерятся по-разному
  // в разных клиентах и не наследуют цвет темы.
  const ICON = {
    bell: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg>',
    bellOff: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M17 17H4a1 1 0 0 1-.74-1.673C4.59 13.956 6 12.499 6 8a6 6 0 0 1 .258-1.742"/><path d="m2 2 20 20"/><path d="M8.668 3.01A6 6 0 0 1 18 8c0 2.687.77 4.653 1.707 6.05"/></svg>',
    trash: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6"/></svg>',
    reset: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>',
    power: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/></svg>',
    x: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
    warn: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-top:1px"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4M12 17h.01"/></svg>',
  };

  const METRICS = { yidx: "Y-IDX", dm: "DM", ytm: "YTM", price: "цена", gspread: "G-спред" };
  const UNITS = { yidx: " бп", dm: " бп", ytm: "%", price: "", gspread: " бп" };
  const RATINGS = ["AAA", "AA", "A", "BBB", "BB", "B"];
  const COOLDOWNS = [[60, "1 ч"], [240, "4 ч"], [480, "8 ч"], [1440, "1 день"]];

  let state = { tab: "alerts", muted: false, alerts: [], filters: [] };

  async function api(path, opts = {}) {
    const r = await fetch(API + path, Object.assign({}, opts, {
      headers: Object.assign({ "Authorization": "tma " + initData,
                               "Content-Type": "application/json" }, opts.headers || {}),
    }));
    if (!r.ok) {
      let d = ""; try { d = (await r.json()).detail || ""; } catch (e) {}
      throw new Error(d || ("Ошибка " + r.status));
    }
    return r.json();
  }

  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const money = (v) => v >= 1e6 ? (Math.round(v / 1e5) / 10) + " млн"
    : v >= 1e3 ? Math.round(v / 1e3) + " тыс" : String(v);
  const confirmAsk = (text, cb) =>
    (tg && tg.showConfirm) ? tg.showConfirm(text, (ok) => ok && cb()) : (confirm(text) && cb());
  const haptic = (t) => { try { tg.HapticFeedback.notificationOccurred(t); } catch (e) {} };

  // --- рендер списков ---

  function alertCard(a) {
    const badge = a.status === "fired"
      ? '<span class="badge fired"><span class="dot"></span>сработал</span>'
      : a.status === "active" ? '<span class="badge on"><span class="dot"></span>активен</span>'
      : '<span class="badge off">отменён</span>';
    const vol = a.min_volume
      ? ` · объём ≥ ${money(a.min_volume)} ${a.volume_unit === "rub" ? "₽" : "шт"}` : "";
    const fired = (a.status === "fired" && a.fired_price != null)
      ? `<div class="meta num">сработал по ${a.fired_price}${a.fired_volume ? " · " + money(a.fired_volume) + " шт" : ""}</div>` : "";
    return `<article class="card" data-id="${a.id}">
      <div class="card-top">
        <div><div class="card-title">${esc(a.name || a.isin)}</div>
          <div class="card-sub num">${esc(a.isin)}${a.kind === "fixed" ? " · фикс" : ""}</div></div>
        ${badge}
      </div>
      <div class="cond num"><span class="side ${a.side}">${a.side === "buy" ? "покупка" : "продажа"}</span>
        <span>${METRICS[a.metric] || a.metric} ${a.op === ">=" ? "≥" : "≤"} ${a.threshold}${UNITS[a.metric] || ""}${vol}</span></div>
      ${fired}
      ${a.note ? `<div class="meta">${esc(a.note)}</div>` : ""}
      <div class="card-actions">
        ${a.status === "fired" ? `<button data-act="rearm">${ICON.reset}Взвести снова</button>` : ""}
        <button data-act="del" class="danger">${ICON.trash}Удалить</button>
      </div></article>`;
  }

  function filterSummary(p) {
    const who = [];
    if (p.ratings && p.ratings.length) who.push("рейтинг " + p.ratings.join("/"));
    if (p.emitters && p.emitters.length)
      who.push(p.emitters.length === 1 ? p.emitters[0] : p.emitters.length + " эмитентов");
    if (p.isins && p.isins.length) who.push(p.isins.length + " ISIN");
    let scope = who.length ? who.join(" или ") : "весь рынок";
    if (p.hide_subord) scope += ", без субордов";
    let range;
    if (p.spread_min != null && p.spread_max != null) range = `${p.spread_min}–${p.spread_max} бп`;
    else if (p.spread_min != null) range = `от ${p.spread_min} бп`;
    else range = `до ${p.spread_max} бп`;
    let years = "";
    if (p.years_min != null && p.years_max != null) years = ` · срок ${p.years_min}–${p.years_max} л`;
    else if (p.years_min != null) years = ` · срок от ${p.years_min} л`;
    else if (p.years_max != null) years = ` · срок до ${p.years_max} л`;
    const m = (p.min_money_rub ? ` · от ${money(p.min_money_rub)} ₽ в стакане` : "") + years;
    return { scope, range, m };
  }

  function filterCard(f) {
    const s = filterSummary(f.params);
    const cd = COOLDOWNS.find((c) => c[0] === f.cooldown_min);
    return `<article class="card" data-fid="${f.id}">
      <div class="card-top">
        <div><div class="card-title">${esc(f.name)}</div>
          <div class="card-sub">${esc(s.scope)}</div></div>
        ${f.enabled ? '<span class="badge on"><span class="dot"></span>вкл</span>'
                    : '<span class="badge off">выкл</span>'}
      </div>
      <div class="cond num"><span class="side ${f.params.side}">${f.params.side === "ask" ? "оффер" : "бид"}</span>
        <span>Y-IDX ${s.range}${s.m}</span></div>
      <div class="meta">повтор не чаще, чем раз в ${cd ? cd[1] : f.cooldown_min + " мин"}</div>
      <div class="card-actions">
        <button data-fact="toggle">${ICON.power}${f.enabled ? "Выключить" : "Включить"}</button>
        <button data-fact="del" class="danger">${ICON.trash}Удалить</button>
      </div></article>`;
  }

  // --- каркас ---

  function shell() {
    return `<header>
        <div class="tabs" role="tablist">
          <button role="tab" id="tab-alerts" aria-selected="${state.tab === "alerts"}">Алерты</button>
          <button role="tab" id="tab-screen" aria-selected="${state.tab === "screener"}">Скринер</button>
        </div>
        <button class="icon-btn" id="mute" aria-pressed="${state.muted}"
          aria-label="${state.muted ? "Включить уведомления" : "Выключить уведомления"}"
          title="${state.muted ? "Уведомления выключены" : "Уведомления включены"}">
          ${state.muted ? ICON.bellOff : ICON.bell}</button>
      </header>
      <main id="pane"></main>`;
  }

  function alertsPane() {
    return `<div id="list">${state.alerts.map(alertCard).join("")
      || '<div class="empty">Алертов пока нет. Создай первый — он придёт картинкой стакана.</div>'}</div>
      <form id="af" novalidate>
        <div class="form-title">Новый алерт</div>
        <label class="f" for="q"><span>Бумага</span>
          <div class="picker"><input id="q" type="search" autocomplete="off"
            placeholder="ISIN или название" enterkeyhint="search" />
            <div class="suggest" id="suggest" hidden></div></div></label>
        <label class="f"><span>Сторона стакана</span>
          <div class="seg side" id="a-side">
            <button type="button" data-v="buy" aria-pressed="true">Покупка</button>
            <button type="button" data-v="sell" aria-pressed="false">Продажа</button>
          </div></label>
        <label class="f"><span>Тип бумаги</span>
          <div class="seg" id="a-kind">
            <button type="button" data-v="floater" aria-pressed="true">Флоатер</button>
            <button type="button" data-v="fixed" aria-pressed="false">Фикс</button>
          </div></label>
        <label class="f"><span>Метрика и порог</span>
          <div class="row">
            <div class="seg" id="a-metric" style="flex:2">
              <button type="button" data-v="yidx" aria-pressed="true">Y-IDX</button>
              <button type="button" data-v="dm" aria-pressed="false">DM</button>
              <button type="button" data-v="price" aria-pressed="false">Цена</button>
            </div>
            <div class="seg" id="a-op" style="flex:1">
              <button type="button" data-v=">=" aria-pressed="true">≥</button>
              <button type="button" data-v="<=" aria-pressed="false">≤</button>
            </div>
          </div>
          <input id="thr" type="number" inputmode="decimal" step="any"
                 placeholder="порог" style="margin-top:8px" required /></label>
        <label class="f" for="vol"><span>Минимальный объём на уровне</span>
          <div class="row">
            <input id="vol" type="number" inputmode="numeric" step="any" placeholder="0 — любой" />
            <div class="seg" id="a-unit" style="max-width:112px">
              <button type="button" data-v="rub" aria-pressed="true">₽</button>
              <button type="button" data-v="bonds" aria-pressed="false">шт</button>
            </div>
          </div></label>
        <label class="f" for="note"><span>Заметка</span>
          <input id="note" type="text" placeholder="необязательно" /></label>
        <button class="submit" type="submit">Создать алерт</button>
        <div class="err" id="aerr"></div>
        <div class="hint">Сработавший алерт приходит картинкой стакана и встаёт на паузу — пока не взведёшь снова.</div>
      </form>`;
  }

  function screenerPane() {
    return `<div id="flist">${state.filters.map(filterCard).join("")
      || '<div class="empty">Фильтров нет. Задай условия — бот пришлёт бумаги, которые под них попадут.</div>'}</div>
      <form id="ff" novalidate>
        <div class="form-title">Новый фильтр</div>
        <label class="f" for="fname"><span>Название</span>
          <input id="fname" type="text" placeholder="например, широкие ААА" required /></label>

        <fieldset>
          <legend>Какие бумаги</legend>
          <label class="f"><span>Рейтинг</span>
            <div class="chips" id="f-ratings">${RATINGS.map((r) =>
              `<button type="button" class="chip" data-v="${r}" aria-pressed="false">${r}</button>`).join("")}</div></label>
          <label class="f" for="femit"><span>Эмитенты</span>
            <div class="picker"><input id="femit" type="search" autocomplete="off"
              placeholder="начни вводить название" />
              <div class="suggest" id="esuggest" hidden></div></div>
            <div class="chips" id="echips" style="margin-top:6px"></div></label>
          <label class="f" for="fisin"><span>Отдельные бумаги</span>
            <div class="picker"><input id="fisin" type="search" autocomplete="off"
              placeholder="ISIN или название" />
              <div class="suggest" id="isuggest" hidden></div></div>
            <div class="chips" id="ichips" style="margin-top:6px"></div></label>
          <label class="check"><input type="checkbox" id="fsub" /><span>Прятать суборды</span></label>
          <div class="hint">Условия объединяются по «или»: подойдёт бумага, попавшая хотя бы в один список. Ничего не выбрано — смотрим весь рынок. Суборды определяем по названию (СУБ, Т1, перп) — признака в реестре нет.</div>
        </fieldset>

        <fieldset>
          <legend>Условия</legend>
          <label class="f"><span>Сторона стакана</span>
            <div class="seg side" id="f-side">
              <button type="button" data-v="ask" aria-pressed="true">Оффер</button>
              <button type="button" data-v="bid" aria-pressed="false">Бид</button>
            </div></label>
          <label class="f"><span>Диапазон Y-IDX, бп</span>
            <div class="row">
              <input id="fmin" type="number" inputmode="numeric" step="any" placeholder="от" />
              <input id="fmax" type="number" inputmode="numeric" step="any" placeholder="до" />
            </div></label>
          <label class="f" for="fmoney"><span>Денег в стакане на этой стороне, ₽</span>
            <input id="fmoney" type="number" inputmode="numeric" step="any" placeholder="0 — не важно" /></label>
          <label class="f"><span>Срок до погашения, лет</span>
            <div class="frow">
              <input id="fymin" type="number" inputmode="decimal" step="any" placeholder="от" />
              <input id="fymax" type="number" inputmode="decimal" step="any" placeholder="до" />
            </div></label>
          <label class="f"><span>Повторять не чаще</span>
            <div class="seg" id="f-cd">${COOLDOWNS.map(([v, t], i) =>
              `<button type="button" data-v="${v}" aria-pressed="${i === 1}">${t}</button>`).join("")}</div></label>
        </fieldset>

        <button class="submit" type="submit">Создать фильтр</button>
        <div class="err" id="ferr"></div>
        <div class="hint">Бот проверяет рынок в торговые часы и присылает бумаги, попавшие под фильтр.</div>
      </form>`;
  }

  // --- поведение ---

  function seg(id, initial) {
    const box = $(id);
    let val = initial;
    box.addEventListener("click", (ev) => {
      const b = ev.target.closest("button[data-v]");
      if (!b) return;
      val = b.getAttribute("data-v");
      [...box.querySelectorAll("button")].forEach((x) =>
        x.setAttribute("aria-pressed", String(x === b)));
    });
    return () => val;
  }

  function chipGroup(id) {
    const box = $(id);
    box.addEventListener("click", (ev) => {
      const b = ev.target.closest(".chip");
      if (!b) return;
      b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true");
    });
    return () => [...box.querySelectorAll('.chip[aria-pressed="true"]')]
      .map((b) => b.getAttribute("data-v"));
  }

  /** Пикер: ищет по API, показывает список, выбранное копит чипами. */
  function multiPicker({ input, suggest, chips, fetchItems, keyOf, labelOf, subOf }) {
    const inp = $(input), sug = $(suggest), box = $(chips);
    const picked = new Map();
    let timer = null;

    function draw() {
      box.innerHTML = [...picked.entries()].map(([k, label]) =>
        `<button type="button" class="chip removable" data-k="${esc(k)}">${esc(label)}${ICON.x}</button>`).join("");
    }
    box.addEventListener("click", (ev) => {
      const b = ev.target.closest(".chip");
      if (!b) return;
      picked.delete(b.getAttribute("data-k"));
      draw();
    });
    inp.addEventListener("input", () => {
      clearTimeout(timer);
      const q = inp.value.trim();
      if (q.length < 2) { sug.hidden = true; return; }
      timer = setTimeout(async () => {
        try {
          const items = await fetchItems(q);
          sug.innerHTML = items.map((it) =>
            `<button type="button" data-k="${esc(keyOf(it))}" data-l="${esc(labelOf(it))}">${esc(labelOf(it))}
              ${subOf(it) ? `<span class="s-sub num">${esc(subOf(it))}</span>` : ""}</button>`).join("");
          sug.hidden = !items.length;
        } catch (e) { sug.hidden = true; }
      }, 220);
    });
    sug.addEventListener("click", (ev) => {
      const b = ev.target.closest("button[data-k]");
      if (!b) return;
      picked.set(b.getAttribute("data-k"), b.getAttribute("data-l"));
      inp.value = ""; sug.hidden = true; draw();
    });
    document.addEventListener("click", (ev) => {
      if (!sug.hidden && !ev.target.closest("#" + suggest) && ev.target !== inp) sug.hidden = true;
    });
    return { values: () => [...picked.keys()], raw: () => inp.value.trim() };
  }

  function wireAlerts() {
    $("list").addEventListener("click", async (ev) => {
      const b = ev.target.closest("button[data-act]");
      if (!b) return;
      const id = b.closest(".card").getAttribute("data-id");
      const act = b.getAttribute("data-act");
      try {
        if (act === "del") {
          confirmAsk("Удалить алерт?", async () => {
            await api("/alerts/" + id, { method: "DELETE" }); load();
          });
          return;
        }
        await api("/alerts/" + id, { method: "PATCH", body: "{}" });
        load();
      } catch (e) { alert(e.message); }
    });

    const side = seg("a-side", "buy"), kind = seg("a-kind", "floater");
    const metric = seg("a-metric", "yidx"), op = seg("a-op", ">="), unit = seg("a-unit", "rub");

    // бумага у алерта одна — пикер одиночный, без чипов
    const inp = $("q"), sug = $("suggest");
    let chosenIsin = null, timer = null;
    inp.addEventListener("input", () => {
      chosenIsin = null;
      clearTimeout(timer);
      const q = inp.value.trim();
      if (/^[A-Za-z]{2}[A-Za-z0-9]{10}$/.test(q)) { chosenIsin = q.toUpperCase(); sug.hidden = true; return; }
      if (q.length < 2) { sug.hidden = true; return; }
      timer = setTimeout(async () => {
        try {
          const res = (await api("/search?q=" + encodeURIComponent(q))).results;
          sug.innerHTML = res.map((r) =>
            `<button type="button" data-k="${esc(r.isin)}" data-l="${esc(r.name)}">${esc(r.name)}
              <span class="s-sub num">${esc(r.isin)}${r.rating ? " · " + esc(r.rating) : ""}</span></button>`).join("");
          sug.hidden = !res.length;
        } catch (e) { sug.hidden = true; }
      }, 220);
    });
    sug.addEventListener("click", (ev) => {
      const b = ev.target.closest("button[data-k]");
      if (!b) return;
      chosenIsin = b.getAttribute("data-k");
      inp.value = b.getAttribute("data-l") + " · " + chosenIsin;
      sug.hidden = true;
    });

    $("af").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const err = $("aerr"); err.textContent = "";
      const typed = $("q").value.trim().toUpperCase();
      const isin = chosenIsin || (/^[A-Z]{2}[A-Z0-9]{10}$/.test(typed) ? typed : null);
      if (!isin) { err.innerHTML = ICON.warn + "<span>Выбери бумагу из подсказок или введи ISIN целиком.</span>"; return; }
      const thr = parseFloat($("thr").value);
      if (!isFinite(thr)) { err.innerHTML = ICON.warn + "<span>Укажи порог.</span>"; return; }
      const btn = $("af").querySelector(".submit");
      btn.disabled = true; btn.textContent = "Создаём…";
      try {
        await api("/alerts", { method: "POST", body: JSON.stringify({
          isin, side: side(), kind: kind(), metric: metric(), op: op(),
          threshold: thr, min_volume: parseFloat($("vol").value) || 0,
          volume_unit: unit(), note: $("note").value.trim() || null }) });
        haptic("success"); load();
      } catch (e) {
        err.innerHTML = ICON.warn + "<span>" + esc(e.message) + "</span>";
        btn.disabled = false; btn.textContent = "Создать алерт";
      }
    });
  }

  function wireScreener() {
    $("flist").addEventListener("click", async (ev) => {
      const b = ev.target.closest("button[data-fact]");
      if (!b) return;
      const card = b.closest(".card"), fid = card.getAttribute("data-fid");
      try {
        if (b.getAttribute("data-fact") === "del") {
          confirmAsk("Удалить фильтр?", async () => {
            await api("/filters/" + fid, { method: "DELETE" }); load();
          });
          return;
        }
        const on = b.textContent.trim().startsWith("Включить");
        await api("/filters/" + fid, { method: "PATCH", body: JSON.stringify({ enabled: on }) });
        load();
      } catch (e) { alert(e.message); }
    });

    const ratings = chipGroup("f-ratings");
    const side = seg("f-side", "ask"), cd = seg("f-cd", "240");
    const emitters = multiPicker({
      input: "femit", suggest: "esuggest", chips: "echips",
      fetchItems: async (q) => (await api("/emitters?q=" + encodeURIComponent(q))).emitters.map((n) => ({ n })),
      keyOf: (x) => x.n, labelOf: (x) => x.n, subOf: () => "",
    });
    const isins = multiPicker({
      input: "fisin", suggest: "isuggest", chips: "ichips",
      fetchItems: async (q) => (await api("/search?q=" + encodeURIComponent(q))).results,
      keyOf: (r) => r.isin, labelOf: (r) => r.name,
      subOf: (r) => r.isin + (r.rating ? " · " + r.rating : ""),
    });

    $("ff").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const err = $("ferr"); err.textContent = "";
      const name = $("fname").value.trim();
      if (!name) { err.innerHTML = ICON.warn + "<span>Дай фильтру название.</span>"; return; }
      const lo = parseFloat($("fmin").value), hi = parseFloat($("fmax").value);
      if (!isFinite(lo) && !isFinite(hi)) {
        err.innerHTML = ICON.warn + "<span>Задай хотя бы одну границу диапазона Y-IDX.</span>"; return;
      }
      const btn = $("ff").querySelector(".submit");
      btn.disabled = true; btn.textContent = "Создаём…";
      try {
        await api("/filters", { method: "POST", body: JSON.stringify({
          name, cooldown_min: parseInt(cd(), 10),
          params: {
            ratings: ratings(), emitters: emitters.values(), isins: isins.values(),
            side: side(),
            spread_min: isFinite(lo) ? lo : null,
            spread_max: isFinite(hi) ? hi : null,
            min_money_rub: parseFloat($("fmoney").value) || null,
            years_min: $("fymin").value === "" ? null : parseFloat($("fymin").value),
            years_max: $("fymax").value === "" ? null : parseFloat($("fymax").value),
            hide_subord: $("fsub").checked,
          } }) });
        haptic("success"); load();
      } catch (e) {
        err.innerHTML = ICON.warn + "<span>" + esc(e.message) + "</span>";
        btn.disabled = false; btn.textContent = "Создать фильтр";
      }
    });
  }

  function paint() {
    app.innerHTML = shell();
    $("pane").innerHTML = state.tab === "alerts" ? alertsPane() : screenerPane();
    $("tab-alerts").onclick = () => { if (state.tab !== "alerts") { state.tab = "alerts"; paint(); } };
    $("tab-screen").onclick = () => { if (state.tab !== "screener") { state.tab = "screener"; paint(); } };
    $("mute").onclick = async () => {
      state.muted = !state.muted;
      paint();
      try { await api("/mute", { method: "POST", body: JSON.stringify({ muted: state.muted }) }); }
      catch (e) { state.muted = !state.muted; paint(); }
    };
    if (state.tab === "alerts") wireAlerts(); else wireScreener();
  }

  async function load() {
    try {
      const [me, al, fl] = await Promise.all([api("/me"), api("/alerts"), api("/filters")]);
      state.muted = me.muted;
      state.alerts = al.alerts;
      state.filters = fl.filters;
      paint();
    } catch (e) {
      app.innerHTML = `<div class="screen">${esc(e.message)}<br><br>Попробуй переоткрыть приложение.</div>`;
    }
  }

  load();
})();
</script>
</body>
