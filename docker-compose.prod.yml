# Prod-стек Floaters Desk для deskdeskdesk.ru.
# Отдельный compose-проект (name: floaters-prod), подключён к внешней сети
# astra-prod_default — чтобы Caddy (в astra-prod) резолвил сервис по имени `floaters`.
#
# Деплой:
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# Caddy: добавить блок deskdeskdesk.ru → reverse_proxy floaters:8000 в /root/catalog/Caddyfile.

name: floaters-prod

services:
  floaters:
    build: .
    restart: unless-stopped
    # Хардненинг RCE: запрет эскалации привилегий + сброс ВСЕХ Linux-caps
    # (uvicorn на :8000 не требует ни одной). Полный non-root отложен: data/ —
    # root-owned bind-mount (users.json/funds-БД), наивный USER сломал бы запись;
    # нужен entrypoint-drop (gosu) с chown volume на старте.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Контейнер живёт по Москве. База python:3.12-slim — UTC, а сервисный слой
    # опирается на date.today(): в окне 00:00-03:00 МСК «сегодня» съезжало на
    # вчера (напр. часовой налив баров на :07 в 01:07/02:07 относил сегодняшний
    # бар к прошлому дню). Воркеры уже считают время через datetime.now(_MSK) —
    # это закрывает оставшийся наивный слой.
    environment:
      TZ: Etc/GMT-3        # знак инвертирован по POSIX: GMT-3 == UTC+3 == МСК
    env_file:
      - .env
    # api.telegram.org: DNS хостера (reg.ru) отдаёт по имени ТОЛЬКО AAAA-запись,
    # а IPv6-маршрута на VPS нет → «Network is unreachable». Часть IPv4-пула
    # Telegram с этого хоста тоже не пингуется; 149.154.167.220 доступен и
    # отвечает. Пишем его в /etc/hosts контейнера — имя (а значит SNI и проверка
    # сертификата) остаётся прежним. Сменить: TG_API_IP в .env.
    extra_hosts:
      - "api.telegram.org:${TG_API_IP:-149.154.167.220}"
    # Лимит памяти: idle ~95MB, пик на pandas+юниверсе. 768MB стало тесно —
    # живой стрим всего рынка (котировки+стаканы+сделки, 12 сокетов) держит
    # 350MB уже на старте и за 13ч аптайма догуливал до 663MB, то есть длинный
    # аптайм упирался в потолок. 1.2GB — с запасом и по-прежнему безопасно для
    # соседнего стека astra-prod: на 3.8GB VPS свободно ~2.5GB.
    mem_limit: 1200m
    mem_reservation: 256m
    # ЖИВОСТЬ ПРОЦЕССА, А НЕ ФАКТ ЗАПУСКА: restart ловит только exit и OOM-kill,
    # а самый частый отказ — залипший event loop (сайт «висит», контейнер
    # Running). /api/health открыта без сессии и отвечает из петли, поэтому
    # проверка меряет именно её отзывчивость. curl в python:slim нет — стучимся
    # штатным urllib.
    # ВНИМАНИЕ: docker compose сам по себе unhealthy-контейнер НЕ перезапускает,
    # он только метит его. Рестарт по метке даёт сайдкар autoheal (см. ниже).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5           # 2.5 минуты подряд без ответа — это отказ, а не пик
      start_period: 180s   # холодный старт греет кэши и поднимает пулы сокетов
    labels:
      autoheal: "true"     # по этой метке сайдкар autoheal и рестартит (см. ниже)
    networks:
      - web
    expose:
      - "8000"
    volumes:
      # Аккаунты дашборда (data/users.json) — переживают редеплой.
      - ./data:/app/data
    # Только порядок старта: доставка в TG и так с ретраями, падение сайдкара
    # приложение не роняет.
    depends_on:
      - tgproxy

  # Сайдкар-выход в Telegram: Xray держит VLESS/Reality-туннель наружу и отдаёт
  # внутрь сети SOCKS5 на 1080. Порт наружу НЕ публикуется — только по имени
  # `tgproxy` из сети astra-prod_default, вход под паролем (см. config.json).
  # Через него ходят ТОЛЬКО вызовы Bot API (TG_PROXY в .env); биржевой трафик
  # идёт напрямую. Вебхук входящий — его это не касается.
  #
  # Конфиг лежит ВНЕ репозитория (/root/xray/config.json, chmod 600): в нём
  # UUID VPN-подписки и пароль SOCKS, rsync деплоя его не трогает. Смена узла
  # или подписки = правка этого файла + `docker compose restart tgproxy`.
  # user 0:0 обязателен: образ стартует не под root и не читает root-owned mount.
  tgproxy:
    image: ghcr.io/xtls/xray-core:latest
    restart: unless-stopped
    user: "0:0"
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    networks:
      - web
    volumes:
      - /root/xray:/usr/local/etc/xray:ro

  # Рестарт по метке unhealthy: сам compose её только выставляет. Autoheal
  # слушает события docker и перезапускает контейнеры с меткой
  # autoheal=true — сюда её ставит label выше у floaters.
  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "30"
      AUTOHEAL_START_PERIOD: "180"
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    volumes:
      # ДОСТУП К ДЕМОНУ DOCKER = права root на хосте. Осознанный размен:
      # контейнер официальный, ничего наружу не публикует и сокет берёт
      # только на чтение событий и рестарт.
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  web:
    external: true
    name: astra-prod_default
