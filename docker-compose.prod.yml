# Prod-стек Floaters Desk для deskdeskdesk.ru.
# Отдельный compose-проект (name: floaters-prod), подключён к внешней сети
# astra-prod_default — чтобы Caddy (в astra-prod) резолвил сервис по имени `floaters`.
#
# Деплой:
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# Caddy: добавить блок deskdeskdesk.ru → reverse_proxy floaters:8000 в /root/catalog/Caddyfile.

name: floaters-prod

services:
  floaters:
    build: .
    restart: unless-stopped
    # Хардненинг RCE: запрет эскалации привилегий + сброс ВСЕХ Linux-caps
    # (uvicorn на :8000 не требует ни одной). Полный non-root отложен: data/ —
    # root-owned bind-mount (users.json/funds-БД), наивный USER сломал бы запись;
    # нужен entrypoint-drop (gosu) с chown volume на старте.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - .env
    # api.telegram.org: DNS хостера (reg.ru) отдаёт по имени ТОЛЬКО AAAA-запись,
    # а IPv6-маршрута на VPS нет → «Network is unreachable». Часть IPv4-пула
    # Telegram с этого хоста тоже не пингуется; 149.154.167.220 доступен и
    # отвечает. Пишем его в /etc/hosts контейнера — имя (а значит SNI и проверка
    # сертификата) остаётся прежним. Сменить: TG_API_IP в .env.
    extra_hosts:
      - "api.telegram.org:${TG_API_IP:-149.154.167.220}"
    # Лимит памяти: idle ~95MB, пик на pandas+юниверс НРД. 768MB — потолок,
    # защищает соседний стек astra-prod от OOM-killer на общем 3.8GB VPS.
    mem_limit: 768m
    mem_reservation: 256m
    networks:
      - web
    expose:
      - "8000"
    volumes:
      # Аккаунты дашборда (data/users.json) — переживают редеплой.
      - ./data:/app/data

networks:
  web:
    external: true
    name: astra-prod_default
